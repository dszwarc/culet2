{% extends "base.html" %}

{% block content %}
<h1>Create Repair</h1>
<p>Enter either the original job barcode or stock number, not both.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Create Repair
    </button>
</form>
{% endblock %}
