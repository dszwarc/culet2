{% extends 'base.html' %}

{% block content %}

<div class="page-header">
  <h1>Assign Jobs</h1>
  <p>Scan multiple jobs, choose an employee, then assign them all at once.</p>
</div>

<form method="post" class="form-card">
  {% csrf_token %}

  <div class="form-group">
    <label for="id_employee">Assign To</label>
    <select name="employee" id="id_employee" required>
      <option value="">Choose employee...</option>

      {% if managers %}
        <optgroup label="Managers">
          {% for employee in managers %}
            <option value="{{ employee.id }}">
              {{ employee.user.first_name }} {{ employee.user.last_name }}
            </option>
          {% endfor %}
        </optgroup>
      {% endif %}

      {% if employees %}
        <optgroup label="Employees">
          {% for employee in employees %}
            <option value="{{ employee.id }}">
              {{ employee.user.first_name }} {{ employee.user.last_name }}
            </option>
          {% endfor %}
        </optgroup>
      {% endif %}
    </select>
  </div>

  <div class="form-group">
      <label>
          {% if selected_job %}
              Selected Job
          {% else %}
              Scan Job Barcodes
          {% endif %}
      </label>

      <div id="job-scan-fields">
          {% if selected_job %}
              <input
                  type="hidden"
                  name="job_id"
                  value="{{ selected_job.pk }}"
              >

              <input
                  type="text"
                  value="{{ selected_job.stock_num }}"
                  readonly
              >

              <p class="form-help-text">
                  Barcode: {{ selected_job.barcode }}
              </p>
          {% else %}
              <input
                  name="job"
                  type="text"
                  class="scan-input"
                  placeholder="Scan job barcode"
                  autocomplete="off"
                  required
              >

              <input
                  name="job"
                  type="text"
                  class="scan-input"
                  placeholder="Scan job barcode"
                  autocomplete="off"
              >

              <input
                  name="job"
                  type="text"
                  class="scan-input"
                  placeholder="Scan job barcode"
                  autocomplete="off"
              >
          {% endif %}
      </div>

      {% if not selected_job %}
          <button
              type="button"
              class="btn btn-secondary"
              id="add-job-field"
          >
              + Add Job
          </button>
      {% endif %}
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    onclick="return confirm('Assign all scanned jobs to this employee?');"
  >
    Assign Jobs
  </button>
</form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("job-scan-fields");
    const addButton = document.getElementById("add-job-field");

    if (!container || !addButton) {
        return;
    }

    addButton.addEventListener("click", function () {
        const input = document.createElement("input");

        input.type = "text";
        input.name = "job";
        input.className = "scan-input";
        input.placeholder = "Scan job barcode";
        input.autocomplete = "off";

        container.appendChild(input);
        input.focus();
    });
});
</script>

{% endblock %}
