{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Payroll Report</h1>
    <form method="get" class="report-form mb-4">
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Run Report</button>
        {% if form.is_valid %}
            <a href="{% url 'culet:payroll_excel' %}?{{ request.GET.urlencode }}" class="btn btn-outline-primary">Download Excel</a>
        {% endif %}
    </form>
    <style>
        .payroll-table th, .payroll-table td { vertical-align: middle; }
        .payroll-invalid .payroll-punch { text-decoration: line-through; }
        .payroll-adjusted { font-size: .8em; text-decoration: none; }
        .payroll-editor td { border-left: 3px solid var(--primary, #007bff); }
        .payroll-editor input[type="checkbox"] { width: 1.1rem; height: 1.1rem; min-width: 0; min-height: 0; display: inline-block; vertical-align: middle; }
        .payroll-table .payroll-date { white-space: nowrap; }
    </style>
    {% include "reports/partials/payroll_results.html" %}
</div>
{% endblock %}
