{% if not overlay_only %}
    <button
        type="button"
        class="btn btn-outline-secondary culet-scanner-btn js-culet-scanner-btn"
        data-target="{{ input_id }}"
        data-auto-submit="{{ auto_submit|default:'false' }}"
        data-append-mode="{{ append_mode|default:'false' }}"
        data-scanner-mode="{% if append_mode == 'true' %}append-lines{% else %}replace{% endif %}"
    >
        📷 {{ button_text|default:"Scan with Camera" }}
    </button>
{% endif %}

{% if not button_only %}
    <div class="culet-scanner-overlay" id="culet-scanner-overlay">
        <div class="culet-scanner-box">

            <h2 class="culet-scanner-title">
                Scan Job Barcode
            </h2>

            <div
                id="culet-scanner-reader"
                class="culet-scanner-reader"
            ></div>

            <p class="culet-scanner-help">
                Point your camera at the barcode on the job envelope.
            </p>

            <p
                id="culet-scanner-status"
                class="culet-scanner-status"
                aria-live="polite"
            ></p>

            <div class="culet-scanner-actions">
                <button
                    type="button"
                    class="btn btn-danger"
                    id="culet-scanner-cancel"
                >
                    Done / Close Scanner
                </button>
            </div>

        </div>
    </div>
{% endif %}
